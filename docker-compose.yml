# App Hub – Frontend with hot reload (port 6054, HTTPS in Docker)
# Always start from the project root so mounts are correct. `docker compose up` works directly -
# no host-side wrapper script required (see APP_VERSION below); `./start-docker.sh` remains a
# convenience wrapper that additionally bootstraps local HTTPS certs.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: app-hub-frontend
    ports:
      - '6054:6054'
    volumes:
      # Full frontend tree (public/, angular.json, ssl/) – not only src/
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
      # The frontend container only mounts frontend/, so it otherwise has no .git.
      # write-app-version.cjs reads the nearest SemVer tag from this dir (see below).
      - ./.git:/git:ro
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      # Optional override – if unset, the container resolves the version itself from the
      # bind-mounted .git tag above (no host-side git call, no required env var).
      - APP_VERSION=${APP_VERSION:-}
      - APP_VERSION_GIT_DIR=/git
      # Written to runtime-config.json at container start (never baked into the JS bundle - see
      # deployment.mdc), all optional locally: write-runtime-config.cjs falls back to the
      # Confessio-Test-Tenant + a "Lokal" cluster label when unset.
      - CLUSTER_NAME=${CLUSTER_NAME:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      # Nur nötig, wenn der Backend-Host-Port lokal abweicht (siehe backend.ports unten,
      # z. B. weil Port 6055 auf diesem Rechner von einem anderen Projekt belegt ist).
      - BACKEND_API_URL=${BACKEND_API_URL:-}
      # Anmeldeweg (ADR-19): lokal Keycloak über das Backend-BFF, `entra` für den MSAL-Bestand.
      - AUTH_MODE=${AUTH_MODE:-keycloak}
    command: sh -c "node scripts/ensure-node-modules.cjs && npm run start:docker"

  # Nur für die Admin-Rollenverwaltung nötig (siehe ADR-6) - braucht ein echtes Azure-Client-Secret
  # (AZURE_CLIENT_SECRET), das es noch nicht öffentlich/als Fallback geben kann (echtes Secret,
  # kein "keine Geheimnisse"-Fall wie Tenant-/Client-ID). Ohne Secret beendet sich der Container
  # beim Start mit klarer Fehlermeldung - das Frontend läuft davon unabhängig normal weiter.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: app-hub-backend
    ports:
      # Host-Port per BACKEND_HOST_PORT überschreibbar (.env), falls 6055 auf diesem Rechner
      # bereits von einem anderen Projekt belegt ist. Container-intern bleibt es Port 6055.
      - '${BACKEND_HOST_PORT:-6055}:6055'
    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
      # Gleiche mkcert-Zertifikate wie das Frontend (siehe scripts/setup-ssl.sh) - vermeidet
      # Mixed-Content-Probleme, wenn das HTTPS-Frontend dieses HTTP(S)-Backend aufruft.
      - ./frontend/ssl:/app/ssl:ro
    environment:
      - PORT=6055
      - CORS_ORIGIN=https://localhost:6054
      # Bewusst :- statt :? (im Gegensatz zu APP_VERSION oben): ein fehlendes Secret soll nur
      # *diesen* Container beim Node-Start fail-fast abbrechen lassen (ConfigService.getOrThrow),
      # nicht den kompletten "docker compose up"-Befehl für alle Services blockieren.
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      # Nur für den Tablet-PIN-Login nötig (siehe ADR-12) - fehlen sie, lehnt NUR
      # `POST /tablet-auth/*` mit einer klaren 503 ab, alle anderen Endpunkte laufen unverändert.
      - AZURE_KEY_VAULT_URL=${AZURE_KEY_VAULT_URL:-}
      - TABLET_USERS_GROUP_ID=${TABLET_USERS_GROUP_ID:-}
      - TABLET_SESSION_JWT_SECRET=${TABLET_SESSION_JWT_SECRET:-}
      # Erste eigene Datenbank dieses Backends (siehe ADR-17: zentraler App-Katalog).
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_app_hub
      # Keycloak-BFF (ADR-19). Der Issuer ist die öffentliche Keycloak-URL aus den Tokens, die
      # Discovery läuft intern über das Compose-Netz.
      - AUTH_MODE=${AUTH_MODE:-keycloak}
      - FRONTEND_URL=https://localhost:6054
      - OIDC_ISSUER_URL=https://localhost:${KEYCLOAK_HOST_PORT:-6057}/realms/axora
      - OIDC_DISCOVERY_URL=http://keycloak:8080/realms/axora
      - OIDC_CLIENT_ID=ai-app-hub-bff
      - OIDC_CLIENT_SECRET=${HUB_OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=https://localhost:${BACKEND_HOST_PORT:-6055}/auth/callback
      - OIDC_POST_LOGOUT_REDIRECT_URI=https://localhost:6054/login
      # Rechte und Verwaltung über die Axora IAM API (axora-platform, ADR-20). Die Tokens dafür
      # liegen verschlüsselt in der Sitzung; der Schlüssel kommt aus .env.
      - IAM_API_URL=http://axora-iam-api:6061/api/iam/v1
      - SESSION_TOKEN_KEY=${SESSION_TOKEN_KEY:-}
    command: sh -c "node scripts/ensure-node-modules.cjs && npm run start:docker"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Lokaler Keycloak für die Anmeldung nach dem Axora-IAM-Konzept (ADR-18/ADR-19). Der Realm
  # `axora` samt Client und Dev-Admin kommt als Code aus infra/keycloak/dev/ und wird nur beim
  # ersten Start importiert. Eigene Datenhaltung (dev-file im Volume), keine gemeinsame DB mit
  # dem Backend (platform-architecture.mdc).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: app-hub-keycloak
    command: start-dev --import-realm
    ports:
      - '${KEYCLOAK_HOST_PORT:-6057}:8443'
    volumes:
      - ./infra/keycloak/dev:/opt/keycloak/data/import:ro
      # Login-Theme im Axora-Stil; start-dev cached keine Themes, Änderungen wirken sofort.
      - ./infra/keycloak/themes/axora:/opt/keycloak/themes/axora:ro
      - ./frontend/ssl:/opt/keycloak/conf/tls:ro
      - keycloak_data:/opt/keycloak/data
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD fehlt in .env (siehe .env.example)}
      # Browser und Tokens sehen https://localhost:6057. Das Backend spricht Keycloak intern über
      # http://keycloak:8080 an; die Backchannel-Endpunkte folgen dann dieser Adresse.
      - KC_HOSTNAME=https://localhost:${KEYCLOAK_HOST_PORT:-6057}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/tls/local.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/tls/local-key.pem
      - HUB_OIDC_CLIENT_SECRET=${HUB_OIDC_CLIENT_SECRET:?HUB_OIDC_CLIENT_SECRET fehlt in .env (siehe .env.example)}
      - HUB_OIDC_REDIRECT_URI=https://localhost:${BACKEND_HOST_PORT:-6055}/auth/callback
      - HUB_FRONTEND_URL=https://localhost:6054/
      - HUB_OIDC_POST_LOGOUT_REDIRECT_URI=https://localhost:6054/login
      - HUB_DEV_ADMIN_PASSWORD=${HUB_DEV_ADMIN_PASSWORD:?HUB_DEV_ADMIN_PASSWORD fehlt in .env (siehe .env.example)}
      # Service-Account der Axora IAM API (axora-platform) für Benutzeranlage und Einladungen.
      - IAM_KEYCLOAK_CLIENT_SECRET=${IAM_KEYCLOAK_CLIENT_SECRET:?IAM_KEYCLOAK_CLIENT_SECRET fehlt in .env (siehe .env.example)}

  # Fängt alle Mails von Keycloak ab (Einladungen, Passwort setzen). Oberfläche: http://localhost:6060
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: app-hub-mailpit
    ports:
      - '${MAILPIT_HOST_PORT:-6060}:8025'

  # Zentraler App-Katalog (siehe ADR-17) - erster eigener Datenspeicher von app-hub-backend.
  # Gleiches Muster wie bei den Axora-Bausteinen (z. B. ai-daten-orchestrator/docker-compose.yml).
  postgres:
    image: postgres:16
    container_name: app-hub-postgres
    ports:
      - '${POSTGRES_HOST_PORT:-6056}:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ai_app_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_app_hub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
  keycloak_data:
