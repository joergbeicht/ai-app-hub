# Umgebungs-spezifische, NICHT-sensitive Overrides für confessio-test (siehe deployment.mdc:
# values-<env>.yaml für Unterschiede, gemeinsame Defaults in values.yaml).
replicaCount: 1

# CORS_ORIGIN muss der Origin sein, den der Browser tatsächlich sieht. Seit dem öffentlichen
# Ingress (ADR-11) ist das der öffentliche HTTPS-Host - Frontend und Backend liegen auf
# demselben Host (nur unterschiedliche Pfade, / vs. /api), CORS greift hier also nur noch als
# zusätzliche Absicherung, nicht weil es technisch eine andere Origin wäre.
env:
  corsOrigin: "https://confessio-test.westeurope.cloudapp.azure.com"
  # Tablet-PIN-Login (ADR-12): Key Vault + Sicherheitsgruppe existieren für confessio-test seit
  # 2026-08-12. Beides sind keine Secrets (URL bzw. Objekt-ID), daher hier committed.
  azureKeyVaultUrl: "https://kv-confessio-test.vault.azure.net/"
  tabletUsersGroupId: "4b312459-ca53-4b02-8429-95124ced7731"
