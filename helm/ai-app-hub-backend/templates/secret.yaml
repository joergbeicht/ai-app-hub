# Werte kommen NIE aus dieser Datei mit echtem Inhalt, sondern über `--set-string secrets.xyz=...`
# beim `helm install`/`upgrade` (Pipeline-Secrets bzw. für den ersten manuellen Testdeploy lokal
# aus der Shell) - siehe deployment.mdc "Secrets & Konfiguration".
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
type: Opaque
stringData:
  azure-tenant-id: {{ .Values.secrets.azureTenantId | quote }}
  azure-client-id: {{ .Values.secrets.azureClientId | quote }}
  azure-client-secret: {{ .Values.secrets.azureClientSecret | quote }}
  tablet-session-jwt-secret: {{ .Values.secrets.tabletSessionJwtSecret | quote }}
