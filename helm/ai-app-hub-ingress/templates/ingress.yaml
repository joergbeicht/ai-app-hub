apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-app-hub
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    # /api/... wird an das Backend weitergereicht, aber OHNE das /api-Präfix (Backend-Routen
    # liegen auf Root-Ebene, z. B. /users, /health, /badge-login - siehe backend/src/*.controller.ts).
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: ai-app-hub-tls
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.backend.serviceName }}
                port:
                  number: {{ .Values.backend.servicePort }}
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.frontend.serviceName }}
                port:
                  number: {{ .Values.frontend.servicePort }}
