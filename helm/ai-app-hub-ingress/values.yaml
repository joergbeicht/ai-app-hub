# Öffentlicher Hostname (z. B. per Azure-DNS-Label auf der Ingress-Controller-Public-IP, siehe
# infra/bicep/README.md) - pro Umgebung über values-<env>.yaml überschreiben.
host: ""

# Für die Hub-eigene hub-catalog-ConfigMap (siehe templates/hub-catalog-configmap.yaml) - wird
# beim Helm-Upgrade per --set appVersion=... aus der CI/CD-Pipeline gesetzt, siehe deploy-*.yml.
appVersion: ""

clusterIssuer: letsencrypt-prod

frontend:
  serviceName: ai-app-hub-frontend
  servicePort: 80

backend:
  serviceName: ai-app-hub-backend
  servicePort: 6055
