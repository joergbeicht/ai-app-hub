# Umgebungs-spezifische Overrides für confessio-test. AZURE_TENANT_ID/AZURE_CLIENT_ID sind für
# ein SPA ohnehin öffentlich (siehe platform-architecture.mdc) - dieselbe App-Registrierung wie
# im lokalen Dev-Setup (`ai-app-hub`-App, siehe .env / ADR-6).
replicaCount: 1

env:
  clusterName: "confessio-test"
  azureTenantId: "e72e80bb-76d0-4f0c-8dfe-55259ab5c6e8"
  azureClientId: "c52e2ae0-a32d-46d7-9e1b-a0fdb06ff094"
  # Seit dem öffentlichen Ingress (ADR-11) läuft das Backend unter demselben Host wie das
  # Frontend, nur unter dem Pfad /api (siehe helm/ai-app-hub-ingress) - kein separater Port/Host
  # mehr nötig.
  backendApiUrl: "https://confessio-test.westeurope.cloudapp.azure.com/api"
