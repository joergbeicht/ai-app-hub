<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Axora - AI App Hub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI App Hub" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!--
      Inline statt aus styles.scss: muss ohne JS und ohne Warten auf externes CSS sofort mit dem
      ersten Response-Byte gemalt werden - sonst genau der Blank/Flash-Effekt, den dieser Block
      vermeiden soll (JS-Bundles laden, runtime-config.json-Fetch, MSAL-Init und Router-Guard
      brauchen etwas Zeit, bis Angular ueberhaupt etwas rendert, siehe main.ts). Farben manuell
      synchron mit den Tokens in theme/custom-theme.scss halten (--bg-primary/--text-secondary/
      --text-muted/--primary-500).
    -->
    <style>
      body {
        background-color: #0f172a;
        margin: 0;
      }
      .app-boot-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .app-boot-loading__spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #334155;
        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      .app-boot-loading__text {
        margin: 0;
        font-size: 0.9375rem;
        color: #cbd5e1;
      }
      .app-boot-loading__text-en {
        color: #94a3b8;
        font-size: 0.875rem;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <!--
        Statischer Fallback-Inhalt: Angular ersetzt dies automatisch beim Bootstrap, weil
        AppComponent kein <ng-content> nutzt - kein eigenes JS zum Entfernen noetig. Bleibt
        sichtbar, falls Bootstrap fehlschlaegt, bevor Angular ueberhaupt an <app-root> andockt
        (kein permanenter Blank-Screen ohne Feedback, siehe main.ts/renderBootstrapErrorFallback
        fuer den Fall, dass sogar das fehlschlaegt).
      -->
      <div class="app-boot-loading" role="status" aria-live="polite">
        <span class="app-boot-loading__spinner" aria-hidden="true"></span>
        <p class="app-boot-loading__text">
          Axora AI App Hub wird geladen …<br />
          <span class="app-boot-loading__text-en">Loading …</span>
        </p>
      </div>
    </app-root>
  </body>
</html>
