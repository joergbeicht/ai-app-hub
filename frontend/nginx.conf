server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json;

  # SPA entry must not be cached aggressively (stale shell after new image).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Service worker files must always revalidate.
  location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Generated per container start (cluster/tenant) – never cache, never fall back to index.html.
  location = /runtime-config.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Generated post-build with the current APP_VERSION; polled by PwaUpdateService to detect a new
  # deployment even when the service worker's own update check lags behind - never cache.
  location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # No SPA fallback for real static files (otherwise icons get text/html).
  location ~* ^/(favicon\.(svg|ico)|manifest\.webmanifest|icons/.+)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
