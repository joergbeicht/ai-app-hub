name: Deploy to confessio-test

# confessio-test ist das Test-System (ADR-9), nicht Prod. Deploy läuft erst, wenn Backend CI
# und Frontend CI für denselben Commit grün sind (testing-pipeline.mdc: Stufe 2 ist das Gate
# vor Stufe 3) und HEAD einen exakten Versionstag trägt. Ein Push ohne Tag löst keinen
# Rollout aus. workflow_dispatch bleibt für einen erneuten Deploy eines bereits grünen,
# bereits getaggten Commits.
# Prod-Smoke-Tests und Rollback bleiben beim confessio-prod-Workflow (ADR-10).
on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # Für OIDC/Workload Identity Federation (azure/login) - kein Client-Secret.
  actions: read # CI-Läufe des auslösenden Commits lesen.
  contents: read

# Zwei CI-Abschlüsse lösen diesen Workflow kurz nacheinander aus. Der zweite Lauf wartet,
# statt ein zweites Helm-Upgrade parallel zu starten.
concurrency:
  group: deploy-confessio-test
  cancel-in-progress: false

jobs:
  ci-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Require green CI and a version tag
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          if ! git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::HEAD (${HEAD_SHA}) hat keinen Versionstag. Prozess: git tag vX.Y.Z && git push origin vX.Y.Z, danach den Deploy manuell starten."
              exit 1
            fi
            echo "::notice::HEAD (${HEAD_SHA}) hat keinen Versionstag. Deploy nach confessio-test wird übersprungen."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pending=false
          for workflow in "Backend CI" "Frontend CI"; do
            json=$(gh run list --commit "$HEAD_SHA" --workflow "$workflow" --json status,conclusion --limit 1)
            status=$(echo "$json" | jq -r '.[0].status // empty')
            conclusion=$(echo "$json" | jq -r '.[0].conclusion // empty')
            if [ -z "$status" ]; then
              echo "::error::${workflow} hat keinen Lauf für ${HEAD_SHA}. Beide CI-Workflows müssen grün sein, bevor confessio-test deployt."
              exit 1
            fi
            if [ "$status" != "completed" ]; then
              echo "${workflow} läuft noch für ${HEAD_SHA}. Dieser Versuch deployt nicht; der abschließende CI-Lauf startet den Deploy erneut."
              pending=true
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::${workflow} ist für ${HEAD_SHA} nicht grün (${conclusion})."
              exit 1
            fi
          done

          if [ "$pending" = true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: ci-gate
    if: needs.ci-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: confessio-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          # `git describe` (siehe unten) braucht die volle Tag-Historie - der Default
          # (fetch-depth: 1) liefert nur den letzten Commit ohne erreichbare Tags.
          fetch-depth: 0

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Zweite Sicherung hinter dem CI-Gate: ohne exakten Tag auf diesem Commit kein Rollout.
      # Vorher fiel `git describe` ohne exakten Tag lautlos auf den letzten (ggf. veralteten) Tag
      # zurück - das liess das Operations Center fälschlich "Cluster ist neuer" melden.
      - name: Enforce version tag on HEAD
        run: |
          if ! git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "::error::HEAD ($(git rev-parse --short=8 HEAD)) hat keinen Versionstag. Prozess: erst 'git tag vX.Y.Z' auf dem Release-Commit setzen, dann 'git push origin vX.Y.Z' - erst danach deployt die Pipeline."
            exit 1
          fi

      - name: Determine image tag and app version
        id: image
        run: |
          # workflow_run setzt GITHUB_SHA auf den Workflow-Stand von main, nicht auf den
          # auslösenden Commit. Der Checkout oben ist der CI-Commit, deshalb die SHA von HEAD.
          echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          # Image-Tag (oben) bleibt die Commit-SHA - eindeutig pro Build, für Rollback/Traceability.
          # APP_VERSION (hier) ist die für Menschen sichtbare Versionsnummer im Toolbar-Header
          # (siehe frontend/scripts/write-app-version.cjs) - dank des Gates oben immer der exakte
          # Tag auf HEAD, nie mehr veraltet oder auf eine SHA zurueckgefallen.
          TAG="$(git describe --tags --exact-match HEAD)"
          echo "app_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        run: |
          az acr build --registry acraxoraplatform --resource-group rg-axora-platform \
            --image ai-app-hub-backend:${{ steps.image.outputs.tag }} \
            --file backend/Dockerfile backend

      - name: Build & push frontend image
        run: |
          az acr build --registry acraxoraplatform --resource-group rg-axora-platform \
            --image ai-app-hub-frontend:${{ steps.image.outputs.tag }} \
            --file frontend/Dockerfile \
            --build-arg APP_VERSION=${{ steps.image.outputs.app_version }} \
            frontend

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-confessio-test \
            --name aks-confessio-test \
            --overwrite-existing

      - name: Ensure namespace exists
        run: kubectl create namespace ai-app-hub --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm lint
        run: |
          helm lint ./helm/ai-app-hub-postgres --set-string secrets.postgresPassword=lint
          helm lint ./helm/ai-app-hub-backend
          helm lint ./helm/ai-app-hub-frontend
          helm lint ./helm/ai-app-hub-ingress

      # Postgres must be ready before the backend: its entrypoint runs `prisma migrate deploy` and
      # exits without a reachable database (ADR-17).
      - name: Helm upgrade postgres
        run: |
          helm upgrade --install ai-app-hub-postgres ./helm/ai-app-hub-postgres \
            -f ./helm/ai-app-hub-postgres/values-test.yaml \
            --set-string secrets.postgresPassword=${{ secrets.POSTGRES_PASSWORD }} \
            -n ai-app-hub --wait --timeout 3m

      - name: Helm upgrade backend
        run: |
          helm upgrade --install ai-app-hub-backend ./helm/ai-app-hub-backend \
            -f ./helm/ai-app-hub-backend/values-test.yaml \
            --set image.tag=${{ steps.image.outputs.tag }} \
            --set appVersion=${{ steps.image.outputs.app_version }} \
            --set-string secrets.azureTenantId=${{ vars.AZURE_TENANT_ID }} \
            --set-string secrets.azureClientId=${{ vars.APP_AZURE_CLIENT_ID }} \
            --set-string secrets.azureClientSecret=${{ secrets.APP_AZURE_CLIENT_SECRET }} \
            --set-string secrets.tabletSessionJwtSecret=${{ secrets.TABLET_SESSION_JWT_SECRET }} \
            --set-string secrets.databaseUrl=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@ai-app-hub-postgres:5432/ai_app_hub \
            -n ai-app-hub --wait

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Initial catalog for a fresh database only (ADR-17) - `--if-empty` never touches admin edits.
      - name: Seed hub app catalog (if empty)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:15432/ai_app_hub
        run: |
          npm ci
          npx prisma generate
          kubectl port-forward svc/ai-app-hub-postgres 15432:5432 -n ai-app-hub &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          timeout 60 sh -c 'until pg_isready -h localhost -p 15432 >/dev/null 2>&1; do sleep 1; done'
          npm run seed:hub-apps -- --if-empty

      - name: Helm upgrade frontend
        run: |
          helm upgrade --install ai-app-hub-frontend ./helm/ai-app-hub-frontend \
            -f ./helm/ai-app-hub-frontend/values-test.yaml \
            --set image.tag=${{ steps.image.outputs.tag }} \
            --set appVersion=${{ steps.image.outputs.app_version }} \
            --set env.azureClientId=${{ vars.APP_AZURE_CLIENT_ID }} \
            -n ai-app-hub --wait

      # ingress-nginx + cert-manager + der Let's-Encrypt-ClusterIssuer sind einmaliges,
      # cluster-weites Bootstrapping (siehe ADR-11 / infra/bicep/README.md) - NICHT Teil dieses
      # Workflows, der pro App-Deploy läuft. Der Ingress hier verweist nur auf sie.
      - name: Helm upgrade ingress
        run: |
          helm upgrade --install ai-app-hub-ingress ./helm/ai-app-hub-ingress \
            -f ./helm/ai-app-hub-ingress/values-test.yaml \
            --set appVersion=${{ steps.image.outputs.app_version }} \
            -n ai-app-hub --wait

      - name: Rollout status
        run: |
          kubectl rollout status deployment/ai-app-hub-postgres -n ai-app-hub --timeout=180s
          kubectl rollout status deployment/ai-app-hub-backend -n ai-app-hub --timeout=120s
          kubectl rollout status deployment/ai-app-hub-frontend -n ai-app-hub --timeout=120s
