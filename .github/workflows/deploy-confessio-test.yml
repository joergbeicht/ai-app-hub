name: Deploy to confessio-test

# confessio-test ist ein Test-Cluster, kein Prod (siehe ADR-9) - hier soll jeder Push nach main
# sofort automatisch deployen, damit man beim Öffnen der App immer den aktuellen main-Stand sieht.
# Die "fehlende Prod-Smoke-Tests/Rollback-Logik"-Vorsicht aus testing-pipeline.mdc gilt für einen
# späteren confessio-prod-Workflow (siehe ADR-10 offene Punkte), nicht für dieses Test-Environment.
# workflow_dispatch bleibt zusätzlich für manuelle Re-Deploys (z. B. nach einem fehlgeschlagenen
# Lauf, ohne dafür einen leeren Commit zu brauchen).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # Für OIDC/Workload Identity Federation (azure/login) - kein Client-Secret.
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: confessio-test
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` (siehe unten) braucht die volle Tag-Historie - der Default
          # (fetch-depth: 1) liefert nur den letzten Commit ohne erreichbare Tags.
          fetch-depth: 0

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Determine image tag and app version
        id: image
        run: |
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          # Image-Tag (oben) bleibt die Commit-SHA - eindeutig pro Build, für Rollback/Traceability.
          # APP_VERSION (hier) ist die für Menschen sichtbare Versionsnummer im Toolbar-Header
          # (siehe frontend/scripts/write-app-version.cjs) - der nächste erreichbare Git-Tag, wie
          # lokal auch. Fällt auf die SHA zurück, falls es (noch) keinen Tag gibt.
          echo "app_version=$(git describe --tags --abbrev=0 2>/dev/null || echo "${GITHUB_SHA::8}")" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        run: |
          az acr build --registry acraxoraplatform --resource-group rg-axora-platform \
            --image ai-app-hub-backend:${{ steps.image.outputs.tag }} \
            --file backend/Dockerfile backend

      - name: Build & push frontend image
        run: |
          az acr build --registry acraxoraplatform --resource-group rg-axora-platform \
            --image ai-app-hub-frontend:${{ steps.image.outputs.tag }} \
            --file frontend/Dockerfile \
            --build-arg APP_VERSION=${{ steps.image.outputs.app_version }} \
            frontend

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-confessio-test \
            --name aks-confessio-test \
            --overwrite-existing

      - name: Ensure namespace exists
        run: kubectl create namespace ai-app-hub --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade backend
        run: |
          helm upgrade --install ai-app-hub-backend ./helm/ai-app-hub-backend \
            -f ./helm/ai-app-hub-backend/values-test.yaml \
            --set image.tag=${{ steps.image.outputs.tag }} \
            --set appVersion=${{ steps.image.outputs.app_version }} \
            --set-string secrets.azureTenantId=${{ vars.AZURE_TENANT_ID }} \
            --set-string secrets.azureClientId=${{ vars.APP_AZURE_CLIENT_ID }} \
            --set-string secrets.azureClientSecret=${{ secrets.APP_AZURE_CLIENT_SECRET }} \
            --set-string secrets.tabletSessionJwtSecret=${{ secrets.TABLET_SESSION_JWT_SECRET }} \
            -n ai-app-hub --wait

      - name: Helm upgrade frontend
        run: |
          helm upgrade --install ai-app-hub-frontend ./helm/ai-app-hub-frontend \
            -f ./helm/ai-app-hub-frontend/values-test.yaml \
            --set image.tag=${{ steps.image.outputs.tag }} \
            --set appVersion=${{ steps.image.outputs.app_version }} \
            --set env.azureClientId=${{ vars.APP_AZURE_CLIENT_ID }} \
            -n ai-app-hub --wait

      # ingress-nginx + cert-manager + der Let's-Encrypt-ClusterIssuer sind einmaliges,
      # cluster-weites Bootstrapping (siehe ADR-11 / infra/bicep/README.md) - NICHT Teil dieses
      # Workflows, der pro App-Deploy läuft. Der Ingress hier verweist nur auf sie.
      - name: Helm upgrade ingress
        run: |
          helm upgrade --install ai-app-hub-ingress ./helm/ai-app-hub-ingress \
            -f ./helm/ai-app-hub-ingress/values-test.yaml \
            --set appVersion=${{ steps.image.outputs.app_version }} \
            -n ai-app-hub --wait

      - name: Rollout status
        run: |
          kubectl rollout status deployment/ai-app-hub-backend -n ai-app-hub --timeout=120s
          kubectl rollout status deployment/ai-app-hub-frontend -n ai-app-hub --timeout=120s
