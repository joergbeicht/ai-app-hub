name: Backend CI

on:
  # Push auf main immer: der Deploy nach confessio-test wartet auf diesen Lauf und den
  # Frontend-CI-Lauf desselben Commits (testing-pipeline.mdc). Path-Filter würden das Gate
  # aushebeln, sobald nur eine Seite geändert wurde.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:ci

  build:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_app_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_app_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      # Validation only (no push/deploy - siehe ADR-3). Braucht kein echtes Azure-Client-Secret:
      # der Container startet absichtlich nicht (fail-fast), das ist genau das erwartete Verhalten.
      - name: Build production image (validation only, no push)
        run: docker build -f backend/Dockerfile backend -t app-hub-backend:ci-validate
        working-directory: .
      # Pinned by commit SHA, not a mutable tag - siehe frontend-ci.yml für den Hintergrund
      # (aquasecurity/trivy-action Supply-Chain-Vorfall, März 2026).
      - name: Scan production image for critical/high CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-hub-backend:ci-validate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      # DATABASE_URL zeigt auf den Service-Container. Ohne die Azure-Variablen bricht der
      # Prozess beim Bootstrap ab (GraphService), nachdem die Migration durchgelaufen ist.
      - name: Verify container fails fast without required Azure env vars
        run: |
          set -euo pipefail
          set +e
          timeout 90 docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgresql://postgres:ci@host.docker.internal:5432/ai_app_hub \
            app-hub-backend:ci-validate
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ERROR: container started without AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET - should have failed" >&2
            exit 1
          fi
          if [ "$code" -eq 124 ]; then
            echo "ERROR: container did not exit without the Azure env vars (timed out)" >&2
            exit 1
          fi
        working-directory: .
      - name: Verify health endpoint responds when config is present (Graph calls mocked out via fake secret)
        run: |
          set -euo pipefail
          trap 'docker rm -f ci-validate >/dev/null 2>&1 || true' EXIT
          docker run -d --name ci-validate -p 8081:6055 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgresql://postgres:ci@host.docker.internal:5432/ai_app_hub \
            -e AZURE_TENANT_ID=ci-test-tenant \
            -e AZURE_CLIENT_ID=ci-test-client \
            -e AZURE_CLIENT_SECRET=ci-test-secret \
            -e CORS_ORIGIN=https://ci-test-frontend.example.com \
            app-hub-backend:ci-validate
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8081/health && break
            sleep 1
          done
          curl -sf http://localhost:8081/health | tee /dev/stderr | grep -q '"status":"ok"'
        working-directory: .
