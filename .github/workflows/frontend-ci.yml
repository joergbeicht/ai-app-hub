name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run unit tests (headless Chrome via puppeteer)
        run: CHROME_BIN=$(node -e "console.log(require('puppeteer').executablePath())") npm run test:ci

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve APP_VERSION from git tag
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
      # Validation only (no push/deploy - no ACR/AKS access yet, see ADR-3 in
      # docs/ARCHITEKTUR-ENTSCHEIDUNGEN.md). Catches regressions in Dockerfile/nginx.conf/
      # docker-entrypoint.d scripts before a manual release, since `npm run build` above only
      # covers the raw Angular build, not the deployable container image.
      - name: Build production image (validation only, no push)
        run: |
          docker build -f frontend/Dockerfile frontend \
            --build-arg APP_VERSION="${{ env.APP_VERSION }}" \
            -t app-hub-frontend:ci-validate
        working-directory: .
      # Pinned by commit SHA, not a mutable tag: aquasecurity/trivy-action had 76 of 77 version
      # tags hijacked in a supply-chain attack (March 2026, GHSA-69fq-xp46-6x23). This SHA is the
      # signed v0.36.0 release, published after remediation.
      - name: Scan production image for critical/high CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-hub-frontend:ci-validate
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Verify runtime-config.json is generated at container start (cluster/tenant)
        run: |
          set -euo pipefail
          docker run -d --name ci-validate -p 8080:80 \
            -e CLUSTER_NAME=ci-test-cluster \
            -e AZURE_TENANT_ID=ci-test-tenant \
            -e AZURE_CLIENT_ID=ci-test-client \
            -e BACKEND_API_URL=https://ci-test-backend.example.com \
            app-hub-frontend:ci-validate
          for _ in $(seq 1 10); do
            curl -sf http://localhost:8080/runtime-config.json && break
            sleep 1
          done
          curl -sf http://localhost:8080/runtime-config.json | tee /dev/stderr | grep -q "ci-test-cluster"
          docker rm -f ci-validate
        working-directory: .
      - name: Verify container fails fast without required Azure env vars
        run: |
          set -euo pipefail
          if docker run --rm app-hub-frontend:ci-validate; then
            echo "ERROR: container started without AZURE_TENANT_ID/AZURE_CLIENT_ID - should have failed" >&2
            exit 1
          fi
        working-directory: .
