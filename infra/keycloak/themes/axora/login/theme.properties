# Axora login theme (ADR-19): Login card in the style of ai-axora-portal. Each app sets its
# brand via the client attribute `axora.brand.app` (glyph, accent colour, favicon), see
# template.ftl and css/axora.css. Belongs to the platform repository later (like the realm).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/axora.css

# Dark is the binding Axora default, not system-adaptive (same as ai-axora-portal).
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark
